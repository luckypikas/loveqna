<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Library Contents | LoveQnA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:Arial, Helvetica, sans-serif;

    background:#FFF8E7;

    color:#1A1A1A;

    line-height:1.8;

}

/* ---------------- HEADER ---------------- */

header{

    background:white;

    border-bottom:1px solid #ddd;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:18px 40px;

    position:sticky;

    top:0;

}

.logo{

    font-size:28px;

    font-weight:bold;

    color:#501A1A;

}

nav{

    display:flex;

    gap:25px;

}

nav a{

    color:#1A1A1A;

    text-decoration:none;

    font-weight:bold;

}

nav a:hover{

    color:#501A1A;

}

/* ---------------- LAYOUT ---------------- */

.container{

    display:flex;

    min-height:100vh;

}

/* ---------------- SIDEBAR ---------------- */

.sidebar{

    width:240px;

    background:white;

    border-right:1px solid #ddd;

    padding:25px;

}

.sidebar h3{

    color:#501A1A;

    margin-bottom:20px;

}

.sidebar a{

    display:block;

    color:#1A1A1A;

    text-decoration:none;

    margin-bottom:14px;

}

.sidebar a:hover{

    color:#501A1A;

}

/* ---------------- ARTICLE ---------------- */

main{

    flex:1;

    padding:45px;

}

.breadcrumb{

    font-size:14px;

    margin-bottom:20px;

    color:#666;

}

.article{

    background:white;

    border-radius:12px;

    padding:40px;

    box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.article h1{

    color:#501A1A;

    margin-bottom:10px;

}

.meta{

    color:#777;

    font-size:14px;

    margin-bottom:35px;

}

.article h2{

    margin-top:40px;

    color:#501A1A;
    border-bottom: 2px solid #eee;
    padding-bottom: 5px;

}

.article h3 {
    margin-top: 25px;
    color: #333;
}

.article p{

    margin-top:20px;

}

.article ul {
    margin-top: 15px;
    margin-bottom: 20px;
    padding-left: 40px;
}

.article li {
    margin-bottom: 12px;
}

.article li a {
    color: #1e90ff;
    text-decoration: none;
    font-weight: bold;
}

.article li a:hover {
    color: #ff4757;
    text-decoration: underline;
}

blockquote{

    border-left:5px solid #501A1A;

    padding-left:20px;

    margin:30px 0;

    font-style:italic;
    background-color: #f9f9f9;
    padding: 15px 20px;

}

/* ---------------- TAGS ---------------- */

.tags{

    margin-top:50px;

}

.tag{

    display:inline-block;

    background:#501A1A;

    color:white;

    padding:8px 14px;

    border-radius:20px;

    margin:5px;

    text-decoration:none;

}

/* ---------------- RELATED ---------------- */

.related{

    margin-top:50px;

}

.related ul{

    margin-top:15px;

    padding-left:20px;

}

/* ---------------- NAVIGATION ---------------- */

.page-nav{

    margin-top:60px;

    display:flex;

    justify-content:space-between;

    flex-wrap:wrap;

}

.page-nav a{

    text-decoration:none;

    background:#501A1A;

    color:white;

    padding:12px 20px;

    border-radius:8px;

    margin-top:10px;

}

/* ---------------- FOOTER ---------------- */

footer{

    text-align:center;

    padding:40px;

    color:#777;

}

/* ---------------- MOBILE ---------------- */

@media(max-width:900px){

.container{

    flex-direction:column;

}

.sidebar{

    width:100%;

    border-right:none;

    border-bottom:1px solid #ddd;

}

main{

    padding:20px;

}

header{

    flex-direction:column;

    gap:15px;

}

nav{

    flex-wrap:wrap;

    justify-content:center;

}

}

</style>

</head>

<header
